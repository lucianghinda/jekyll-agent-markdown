name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Jekyll ${{ matrix.jekyll }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.2'
            jekyll: '4.3.0'
            gemfile: gemfiles/jekyll_4_3.gemfile
          - ruby: '4.0'
            jekyll: '4.4'
            gemfile: Gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task with Jekyll ${{ matrix.jekyll }}
        run: bundle exec rake
